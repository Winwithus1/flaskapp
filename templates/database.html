<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Database Records - WinWithUs</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">

  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-blue-700 mb-6">🗃️ Contribution Records</h1>
    <div class="bg-white rounded-xl shadow p-6">
      <p class="mb-4">Here you can view your contribution and purchase history. (This section can be connected to backend APIs using JavaScript)</p>
      <table class="w-full table-auto border-collapse">
        <thead>
          <tr class="bg-blue-200">
            <th class="border px-4 py-2">Date</th>
            <th class="border px-4 py-2">Tickets</th>
            <th class="border px-4 py-2">Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="border px-4 py-2">2025-04-01</td>
            <td class="border px-4 py-2">3</td>
            <td class="border px-4 py-2">$30</td>
          </tr>
          <!-- Add more rows dynamically -->
        </tbody>
      </table>
    </div>
    <a href="index.html" class="block mt-6 text-blue-600 hover:underline">← Back to Home</a>
  </div>

</body>
</html>
