<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder Records - WinWithUs</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 40px;
            text-align: center;
        }
        header h1 {
            font-size: 3.5em;
            margin: 0;
        }
        header p {
            font-size: 1.5em;
            margin-top: 10px;
        }
        .container {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .record-table {
            background-color: #ffffff;
            border: 1px solid #ccc;
            padding: 30px;
            border-radius: 10px;
            margin-top: 30px;
            text-align: left;
        }
        .record-table h3 {
            margin-bottom: 20px;
            font-size: 2em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<header>
    <h1>WinWithUs - Reminder Records</h1>
    <p>View your reminder history and frequency records here.</p>
</header>

<div class="container">
    <div class="record-table">
        <h3>Your Reminder History</h3>
        
        <!-- Table to display reminder records -->
        <table>
            <thead>
                <tr>
                    <th>Reminder ID</th>
                    <th>Reminder Frequency</th>
                    <th>Date Set</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Example record rows, these should be populated dynamically -->
                <tr>
                    <td>1</td>
                    <td>Daily</td>
                    <td>2025-04-08</td>
                    <td>Active</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Weekly</td>
                    <td>2025-03-25</td>
                    <td>Active</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Monthly</td>
                    <td>2025-02-18</td>
                    <td>Completed</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<footer>
    <p>&copy; 2025 WinWithUs. All Rights Reserved.</p>
</footer>

</body>
</html>
